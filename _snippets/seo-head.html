<!--
  SEO HEAD REFERENCE — copy into each page <head> after title/favicon, before stylesheets.
  Replace PAGE_* placeholders per page. Prefer scripts/upgrade-seo-sitewide.py to regenerate.

  Primary URL:  https://normformayor.ca
  Secondary:    norm4mayor.ca (301 redirect at DNS to primary)
  Email:        norm@norm4mayor.ca

  Covered on every public page:
  - Unique title + meta description
  - canonical, robots, author, geo, election meta
  - Open Graph + Twitter Card (incl. image width/height/alt)
  - JSON-LD @graph (WebSite/PoliticalCampaign/Person/Event on home;
    WebPage/ProfilePage/Article + BreadcrumbList + Person on subpages;
    FAQPage, ImageGallery, DonateAction, ItemList where relevant)
  - Microdata itemprops: WebPage, Organization header, Person/sameAs,
    ContactPoint, mainContentOfPage, images
-->
